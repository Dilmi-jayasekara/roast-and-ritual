<!DOCTYPE html>
<html class="light" lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cart - Roast &amp; Ritual</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { background-color: #2C1F18; font-family: 'Manrope', sans-serif; color: #FAF7F2; }
    h1, h2, h3 { font-family: 'Newsreader', serif; }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @keyframes slideOut { from { transform: translateX(0); opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
</style>
</head>
<body>

<nav class="w-full sticky top-0 z-50 bg-[#2C1F18]/95 backdrop-blur-md border-b border-[#D4A373]/20">
<div class="flex justify-between items-center max-w-7xl mx-auto px-8 h-20">
    <div class="text-2xl font-serif italic text-[#D4A373]"><a href="/">Roast & Ritual</a></div>
    <div class="hidden md:flex items-center gap-8">
        <a class="text-[#C5B5A8] hover:text-[#D4A373]" href="/">Home</a>
        <a class="text-[#C5B5A8] hover:text-[#D4A373]" href="/menu">Cafe Menu</a>
        <a class="text-[#C5B5A8] hover:text-[#D4A373]" href="/shop">Shop Beans</a>
        <a class="text-[#C5B5A8] hover:text-[#D4A373]" href="/contact">Contact</a>
    </div>
    <a href="/cart" class="relative flex items-center gap-2 px-5 py-2 bg-[#D4A373] text-[#2C1F18] rounded-full hover:bg-[#E8B88A]">
        <span class="material-symbols-outlined text-xl">shopping_bag</span>
        <span class="text-[10px] uppercase font-bold">Cart</span>
        <span id="cart-count" class="absolute -top-2 -right-2 bg-[#2C1F18] text-[#D4A373] text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
    </a>
</div>
</nav>

<main class="max-w-7xl mx-auto px-8 py-16">
    <h1 class="text-5xl text-[#D4A373] mb-8">Your Cart</h1>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">
        <!-- Cart Items -->
        <div class="lg:col-span-2">
            <div id="cart-items" class="space-y-4">
                <div id="empty-cart" class="text-center py-12 bg-[#362419] rounded-2xl border border-[#D4A373]/20">
                    <span class="material-symbols-outlined text-6xl text-[#D4A373] mb-4">shopping_bag</span>
                    <p class="text-[#C5B5A8] text-lg">Your cart is empty</p>
                    <a href="/shop" class="inline-block mt-4 bg-[#D4A373] text-[#2C1F18] px-6 py-2 rounded-full">Continue Shopping</a>
                </div>
            </div>
        </div>
        
        <!-- Order Summary -->
        <div class="lg:col-span-1">
            <div class="bg-[#362419] rounded-2xl p-6 border border-[#D4A373]/20 sticky top-24">
                <h2 class="text-2xl text-[#D4A373] mb-6">Order Summary</h2>
                <div class="space-y-3 mb-6">
                    <div class="flex justify-between"><span class="text-[#C5B5A8]">Subtotal</span><span id="subtotal">$0.00</span></div>
                    <div class="flex justify-between"><span class="text-[#C5B5A8]">Shipping</span><span>Calculated at checkout</span></div>
                    <div class="border-t border-[#5C4036] pt-3 mt-3"><div class="flex justify-between font-bold"><span class="text-[#D4A373]">Total</span><span id="total" class="text-[#D4A373] text-xl">$0.00</span></div></div>
                </div>
                <!-- UPDATED: Changed from button to link to checkout page -->
                <a id="checkout-btn" href="/checkout" class="block w-full bg-[#D4A373] text-[#2C1F18] py-3 rounded-full font-bold text-center hover:bg-[#E8B88A] transition-all disabled:opacity-50 disabled:cursor-not-allowed pointer-events-auto">Proceed to Checkout</a>
                <a href="/shop" class="block text-center mt-4 text-[#D4A373] text-sm hover:underline">Continue Shopping →</a>
            </div>
        </div>
    </div>
</main>

<footer class="w-full py-16 px-8 mt-20 bg-[#1A120E] border-t border-[#D4A373]/20 text-center">
    <p class="text-[#C5B5A8] text-sm">© 2024 Roast &amp; Ritual. Brewed with intention.</p>
</footer>

<script>
    let cart = JSON.parse(localStorage.getItem('cart')) || [];
    
    function saveCart() { localStorage.setItem('cart', JSON.stringify(cart)); updateCartCount(); }
    
    function updateCartCount() { const total = cart.reduce((s,i)=> s + i.quantity, 0); document.querySelectorAll('#cart-count').forEach(el => el.textContent = total); }
    
    function updateCartDisplay() {
        const container = document.getElementById('cart-items');
        const emptyDiv = document.getElementById('empty-cart');
        const checkoutBtn = document.getElementById('checkout-btn');
        const subtotalSpan = document.getElementById('subtotal');
        const totalSpan = document.getElementById('total');
        
        if (!cart.length) {
            if(emptyDiv) emptyDiv.style.display = 'block';
            if(checkoutBtn) {
                checkoutBtn.style.opacity = '0.5';
                checkoutBtn.style.pointerEvents = 'none';
            }
            if(subtotalSpan) subtotalSpan.textContent = '$0.00';
            if(totalSpan) totalSpan.textContent = '$0.00';
            return;
        }
        
        if(emptyDiv) emptyDiv.style.display = 'none';
        if(checkoutBtn) {
            checkoutBtn.style.opacity = '1';
            checkoutBtn.style.pointerEvents = 'auto';
        }
        
        let subtotal = 0;
        let html = '';
        
        cart.forEach((item, idx) => {
            const itemTotal = item.price * item.quantity;
            subtotal += itemTotal;
            html += `<div class="bg-[#2C1F18] rounded-xl p-4 flex gap-4 items-center border border-[#D4A373]/20">
                <img src="${item.image || '/images/coffee-beans.jpg'}" class="w-20 h-20 object-cover rounded-lg">
                <div class="flex-1">
                    <h3 class="text-[#D4A373] font-bold">${escapeHtml(item.name)}</h3>
                    <p class="text-[#C5B5A8] text-sm">$${item.price.toFixed(2)} each</p>
                    <div class="flex items-center gap-3 mt-2">
                        <button onclick="updateQty(${idx}, -1)" class="bg-[#362419] text-[#D4A373] w-8 h-8 rounded-full hover:bg-[#4A372E]">-</button>
                        <span class="w-8 text-center">${item.quantity}</span>
                        <button onclick="updateQty(${idx}, 1)" class="bg-[#362419] text-[#D4A373] w-8 h-8 rounded-full hover:bg-[#4A372E]">+</button>
                        <button onclick="removeItem(${idx})" class="ml-4 text-[#ba1a1a] text-sm hover:underline">Remove</button>
                    </div>
                </div>
                <div class="text-right"><span class="text-[#D4A373] font-bold">$${itemTotal.toFixed(2)}</span></div>
            </div>`;
        });
        
        container.innerHTML = html;
        subtotalSpan.textContent = `$${subtotal.toFixed(2)}`;
        totalSpan.textContent = `$${subtotal.toFixed(2)}`;
    }
    
    // Helper function to escape HTML
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    function updateQty(index, change) {
        if(cart[index]) {
            cart[index].quantity += change;
            if(cart[index].quantity <= 0) cart.splice(index,1);
            saveCart();
            updateCartDisplay();
        }
    }
    
    function removeItem(index) { 
        cart.splice(index,1); 
        saveCart(); 
        updateCartDisplay(); 
        // Show notification
        showNotification('Item removed from cart', 'info');
    }
    
    function showNotification(message, type) {
        const notification = document.createElement('div');
        notification.textContent = message;
        notification.style.cssText = `
            position: fixed; bottom: 20px; right: 20px;
            background: ${type === 'success' ? '#D4A373' : '#4A372E'};
            color: ${type === 'success' ? '#2C1F18' : '#FAF7F2'};
            padding: 12px 24px; border-radius: 50px; z-index: 9999;
            animation: slideIn 0.3s ease; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        `;
        document.body.appendChild(notification);
        setTimeout(() => {
            notification.style.animation = 'slideOut 0.3s ease';
            setTimeout(() => notification.remove(), 300);
        }, 2000);
    }
    
    // Initial load
    updateCartCount();
    updateCartDisplay();
</script>
</body>
</html>
